# Uso en servidor con GPU NVIDIA (srviatwo):
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen3:4b-instruct
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  api:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      MAX_CHARS: ${MAX_CHARS:-2000}
    ports:
      - "8090:8000"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_models:
